<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="standup-gen — Standup notes from git activity. Multi-repo.">
      <defs>
        <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#0d1117"/>
          <stop offset="100%" stop-color="#161b22"/>
        </linearGradient>
        <linearGradient id="accentLine" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="#79c0ff" stop-opacity="0"/>
          <stop offset="50%" stop-color="#79c0ff" stop-opacity="1"/>
          <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="320" fill="url(#bg)"/>
      <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)"/>
      <text x="60" y="130" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="64" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">standup-gen</text>
      <text x="60" y="175" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#79c0ff">/standup-gen</text>
      <text x="60" y="225" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" fill="#8b949e">Standup notes from git activity. Multi-repo.</text>
      <g transform="translate(820,60)">
    <rect x="0" y="20" width="320" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="50" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#79c0ff">Yesterday</text>
    <text x="20" y="72" font-family="ui-monospace,monospace" font-size="13" fill="#e6edf3">• feat: add login throttle</text>
    <text x="20" y="92" font-family="ui-monospace,monospace" font-size="13" fill="#e6edf3">• test: cover replay path</text>
    <text x="20" y="124" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#79c0ff">Today</text>
    <text x="20" y="146" font-family="ui-monospace,monospace" font-size="13" fill="#8b949e">• open PR for in-flight work</text>
    <text x="20" y="178" font-family="ui-sans-serif,sans-serif" font-size="16" font-weight="700" fill="#79c0ff">Blockers</text>
    <text x="92" y="178" font-family="ui-monospace,monospace" font-size="13" fill="#56d364">— none</text>
</g>
      <text x="60" y="290" font-family="ui-monospace,monospace" font-size="13" fill="#6e7681">pluginpool · MIT · Python 3 stdlib only</text>
